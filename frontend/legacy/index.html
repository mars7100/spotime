<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotime</title>
<link rel="stylesheet" href="style.css">
<div id="app">
  <header>
    <h1>Spotime</h1>
    <span class="upload-group">
      <label class="upload-btn">
        Files
        <input id="file-input" type="file" accept="audio/*,.m4b" hidden multiple>
      </label>
      <label class="upload-btn secondary">
        Folder
        <input id="folder-input" type="file" hidden webkitdirectory>
      </label>
      <button id="download-toggle" class="upload-btn secondary" type="button">Link</button>
    </span>
  </header>

  <form id="download-form" hidden>
    <input id="download-url" type="url" placeholder="YouTube video or playlist URL" autocomplete="off">
    <input id="download-tags" type="text" placeholder="Tags (comma separated, optional)" autocomplete="off">
    <label class="dl-check">
      <input id="download-playlist" type="checkbox">
      Download the whole playlist
    </label>
    <div class="dl-actions">
      <button type="submit" class="upload-btn">Download</button>
      <button type="button" id="download-cancel" class="upload-btn secondary">Cancel</button>
    </div>
  </form>

  <div id="download-status"></div>

  <input id="search" type="search" placeholder="Search title, artist, album…">

  <nav class="tabs">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="music">Music</button>
    <button class="tab" data-filter="audiobook">Audiobooks</button>
  </nav>

  <div id="tag-filter" hidden>
    <div id="filter-chips"></div>
    <div class="tag-search">
      <input id="tag-search-input" type="text" placeholder="Filter by tag…" autocomplete="off">
      <div id="tag-suggestions" hidden></div>
    </div>
  </div>

  <div id="lib-controls">
    <button id="select-toggle" type="button" hidden>Select</button>
  </div>

  <div id="bulk-bar" hidden></div>

  <div id="upload-status"></div>
  <div id="library"></div>
</div>

<div id="toast" hidden></div>
<div id="drop-hint" hidden>Drop audio files or a folder to upload</div>

<footer id="player" hidden>
  <button id="player-collapse" title="Minimize">⌄</button>
  <div id="player-context"></div>
  <img id="player-art" alt="">
  <div class="player-meta">
    <div id="player-title">—</div>
    <div id="player-artist"></div>
  </div>
  <div class="player-controls">
    <button id="prev-track" title="Previous">⏮</button>
    <button id="seek-back" title="Back 15s">« 15</button>
    <button id="play-pause">▶</button>
    <button id="seek-fwd" title="Forward 30s">30 »</button>
    <button id="next-track" title="Next">⏭</button>
    <button id="shuffle-btn" title="Shuffle music">🔀</button>
    <button id="chapters-btn" title="Chapters" hidden>☰</button>
  </div>
  <div class="player-progress">
    <span id="cur-time">0:00</span>
    <input id="seekbar" type="range" min="0" max="1000" value="0">
    <span id="dur-time">0:00</span>
  </div>
  <label class="speed">
    Speed
    <select id="speed">
      <option>0.75</option><option selected>1</option><option>1.25</option>
      <option>1.5</option><option>1.75</option><option>2</option>
    </select>
  </label>
  <audio id="audio"></audio>
</footer>

<div id="chapters-panel" hidden>
  <div class="chapters-head">Chapters</div>
  <ul id="chapters-list"></ul>
</div>

<script src="jsmediatags.min.js"></script>
<script src="app.js"></script>
