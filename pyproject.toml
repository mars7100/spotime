[project]
name = "spotime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "fastapi>=0.141.1",
    "google-cloud-firestore>=2.28.1",
    "google-cloud-storage>=3.13.1",
    "mutagen>=1.48.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "yt-dlp>=2025.1.15",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo is not an installed package; put its root on the path so `backend`
# imports the same way it does under uvicorn.
pythonpath = ["."]
